</div>
<script>
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleSubmit() {
    const pass = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const msgBox = document.getElementById('statusMessage');
    const msgText = document.getElementById('statusText');

    if (pass !== confirm) {
      msgBox.classList.remove('hidden');
      msgText.textContent = 'Las contraseñas no coinciden. Por favor rectifique.';
      msgText.parentElement.querySelector('.material-symbols-outlined').textContent = 'error';
      return;
    }

    msgBox.classList.remove('hidden');
    msgText.parentElement.querySelector('.material-symbols-outlined').textContent = 'check_circle';
    msgText.textContent = '¡Registro completado exitosamente! Redirigiendo a su panel central...';

    setTimeout(() => {
      const activeNav = document.querySelector('nav [data-path="bienvenida"]');
      if (activeNav) activeNav.click();
    }, 1800);
  }
</script></main>
